<div class="auth-container">
  <p-card header="Iniciar Sesión" styleClass="auth-card">
    @if (error()) {
      <p-message severity="error" [text]="error()!" />
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="username">Usuario</label>
        <input
          pInputText
          id="username"
          formControlName="username"
          placeholder="Tu nombre de usuario"
        />
        @if (form.get('username')?.invalid && form.get('username')?.touched) {
          <small class="p-error">El usuario es requerido</small>
        }
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <p-password
          id="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          placeholder="Tu contraseña"
        />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <small class="p-error">La contraseña es requerida</small>
        }
      </div>

      <p-button type="submit" label="Iniciar sesión" [loading]="loading()" styleClass="w-full" />
    </form>

    <div class="auth-footer">
      <span>¿No tienes cuenta?</span>
      <a routerLink="/auth/register">Regístrate</a>
    </div>
  </p-card>
</div>
